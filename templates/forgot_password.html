<!DOCTYPE html>
<html lang="en">

<head>
    <title>Forgot Password</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" href="/static/images/icons/favicon.ico" />
    <link rel="stylesheet" type="text/css" href="/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/static/fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="/static/vendor/animate/animate.css">
    <link rel="stylesheet" type="text/css" href="/static/vendor/css-hamburgers/hamburgers.min.css">
    <link rel="stylesheet" type="text/css" href="/static/vendor/select2/select2.min.css">
    <link rel="stylesheet" type="text/css" href="/static/css/util.css">
    <link rel="stylesheet" type="text/css" href="/static/css/main.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        .helper-text {
            font-size: 13px;
            color: #888;
            padding-left: 10px;
            margin-top: -8px;
            margin-bottom: 15px;
        }

        .section-spacing {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="limiter">
        <div class="container-login100">

            <div class="wrap-login100">

                <!-- LEFT IMAGE -->
                <div class="login100-pic js-tilt" data-tilt>
                    <img src="/static/images/img-01.png" alt="Forgot Password">
                </div>

                <!-- FORM -->
                <form class="login100-form validate-form" id="validate-form" method="post" action="/forgot_password">

                    <!-- TITLE -->
                    <span class="login100-form-title">
                        <i class="fa fa-lock fa-fw" aria-hidden="true"></i>
                        Reset Password
                    </span>

                    <!-- DESCRIPTION -->
                    <div class="text-center p-b-25">
                        <span style="font-size:14px; color:#777;">
                            Enter your username and choose a new password.
                        </span>
                    </div>

                    <!-- USERNAME -->
                    <div class="wrap-input100 validate-input" data-validate="Username is required">
                        <input class="input100" type="text" name="username" id="username" placeholder="Username"
                            autocomplete="username">

                        <span class="focus-input100"></span>

                        <span class="symbol-input100">
                            <i class="fa fa-user" aria-hidden="true"></i>
                        </span>
                    </div>

                    <div class="wrap-input100 validate-input" data-validate="Password is required">

                        <input class="input100" type="password" name="password" id="password"
                            placeholder="Enter new password" autocomplete="new-password">

                        <span class="focus-input100"></span>

                        <span class="symbol-input100">
                            <i class="fa fa-lock" aria-hidden="true"></i>
                        </span>
                        <span class="toggle-password" onclick="togglePassword()">
                            <i class="fa fa-eye" id="eyeIcon"></i>
                        </span>
                    </div>

                    <div class="container-login100-form-btn section-spacing">
                        <button class="login100-form-btn">
                            Update Password
                        </button>
                    </div>

                    <div class="text-center p-t-20">
                        <a class="txt2" href="login">
                            Back to Login
                        </a>
                    </div>

                    <div class="text-center p-t-120">
                        <a class="txt2" href="signup">
                            Don’t have an account?
                            Create one
                            <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
                        </a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    {% if error %}
    <script>
        Swal.fire({
            icon: 'error',
            title: 'Invalid Username',
            text: "{{ error }}",
            confirmButtonColor: '#d33'
        }).then(() => {
            window.history.replaceState({}, document.title, window.location.pathname);
        });
    </script>
    {% endif %}

    <script src="/static/vendor/jquery/jquery-3.2.1.min.js"></script>
    <script src="/static/vendor/bootstrap/js/popper.js"></script>
    <script src="/static/vendor/bootstrap/js/bootstrap.min.js"></script>
    <script src="/static/vendor/select2/select2.min.js"></script>
    <script src="/static/vendor/tilt/tilt.jquery.min.js"></script>

    <script>
        $('.js-tilt').tilt({
            scale: 1.1
        });

        function togglePassword() {
            const password = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>
    <script src="/static/js/main.js"></script>

</body>

</html>
